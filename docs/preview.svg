<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" width="1160" height="560" role="img" aria-label="灵动岛：收起态胶囊与展开态卡片">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#252528"/>
      <stop offset="100%" stop-color="#0f0f11"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64d2ff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#64d2ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64d2ff"/>
      <stop offset="100%" stop-color="#64d2ff" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64d2ff" fill-opacity="0.7"/>
    </marker>
  </defs>

  <g font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">

    <!-- ================= 收起态 ================= -->
    <g filter="url(#sh)">
      <rect x="60" y="238" width="300" height="64" rx="32" fill="url(#glass)"/>
      <rect x="60" y="238" width="300" height="64" rx="32" fill="url(#sheen)"/>
      <rect x="60.5" y="238.5" width="299" height="63" rx="31.5" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
    </g>

    <!-- 天气图标 -->
    <g stroke="#f5f5f7" stroke-opacity="0.92" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M92 276h9.6a3.4 3.4 0 0 0 .3-6.78 5.6 5.6 0 0 0-10.7-1.1A3.9 3.9 0 0 0 92 276Z"/>
      <path d="M94 278.4l-.9 1.8M97.6 278.4l-.9 1.8M101.2 278.4l-.9 1.8"/>
    </g>
    <text x="110" y="277" fill="#f5f5f7" font-size="17" font-weight="600" letter-spacing="-0.5">15°</text>

    <!-- 时间 -->
    <text x="210" y="277" fill="#f5f5f7" font-size="18" font-weight="600" letter-spacing="-0.5" text-anchor="middle">19:42</text>

    <!-- 闹钟 chip -->
    <rect x="288" y="255" width="52" height="26" rx="13" fill="#ffffff" fill-opacity="0.08"/>
    <g stroke="#ff9f0a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M296 268.5a4.4 4.4 0 0 1 8.8 0c0 2.6.6 3.7 1.3 4.4h-11.4c.7-.7 1.3-1.8 1.3-4.4Z"/>
    </g>
    <text x="308" y="271" fill="#ffffff" fill-opacity="0.72" font-size="11.5" font-weight="600">07:30</text>

    <text x="60" y="334" fill="#ffffff" fill-opacity="0.40" font-size="12.5" font-weight="600" letter-spacing="1.2">收起态</text>
    <text x="60" y="354" fill="#ffffff" fill-opacity="0.26" font-size="12">300 × 64 · 药丸形 · 常驻屏幕顶部</text>

    <!-- ================= 中间箭头 ================= -->
    <g>
      <line x1="392" y1="270" x2="524" y2="270" stroke="#64d2ff" stroke-opacity="0.45"
            stroke-width="1.4" stroke-dasharray="5 6" marker-end="url(#arrow)"/>
      <text x="458" y="252" fill="#64d2ff" fill-opacity="0.72" font-size="11.5" font-weight="600" text-anchor="middle">点一下</text>
    </g>

    <!-- ================= 展开态 ================= -->
    <g filter="url(#sh)">
      <rect x="560" y="40" width="404" height="452" rx="40" fill="url(#glass)"/>
      <rect x="560" y="40" width="404" height="452" rx="40" fill="url(#sheen)"/>
      <rect x="560.5" y="40.5" width="403" height="451" rx="39.5" fill="none" stroke="#ffffff" stroke-opacity="0.13"/>
    </g>

    <!-- 顶栏 -->
    <g>
      <g stroke="#f5f5f7" stroke-opacity="0.9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M586 76h8.4a3 3 0 0 0 .3-5.9 4.9 4.9 0 0 0-9.4-1A3.4 3.4 0 0 0 586 76Z"/>
      </g>
      <text x="602" y="77" fill="#ffffff" fill-opacity="0.62" font-size="13.5" font-weight="600">北京</text>
      <text x="762" y="78" fill="#f5f5f7" font-size="17.5" font-weight="600" letter-spacing="-0.5" text-anchor="middle">19:42</text>
      <circle cx="938" cy="72" r="13" fill="#ffffff" fill-opacity="0.08"/>
      <path d="M933.5 67.5l9 9M942.5 67.5l-9 9" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.6" stroke-linecap="round"/>
    </g>

    <!-- 分段控件 -->
    <rect x="580" y="100" width="364" height="30" rx="9" fill="#787880" fill-opacity="0.22"/>
    <rect x="583" y="103" width="119" height="24" rx="7" fill="#63636b"/>
    <text x="642" y="120" fill="#ffffff" font-size="11.5" font-weight="600" text-anchor="middle">天气</text>
    <text x="762" y="120" fill="#ffffff" fill-opacity="0.55" font-size="11.5" font-weight="600" text-anchor="middle">闹钟</text>
    <text x="882" y="120" fill="#ffffff" fill-opacity="0.55" font-size="11.5" font-weight="600" text-anchor="middle">设置</text>

    <!-- 大温度 -->
    <text x="578" y="212" fill="#ffffff" font-size="72" font-weight="200" letter-spacing="-3">15</text>
    <text x="676" y="196" fill="#ffffff" fill-opacity="0.55" font-size="28" font-weight="200">°</text>
    <text x="940" y="172" fill="#f5f5f7" font-size="16" font-weight="600" text-anchor="end">小雨</text>
    <text x="940" y="192" fill="#ffffff" fill-opacity="0.42" font-size="12.5" text-anchor="end">16° / 12°</text>

    <!-- 三格 -->
    <g>
      <rect x="580" y="228" width="112" height="54" rx="13" fill="#ffffff" fill-opacity="0.055"/>
      <text x="594" y="248" fill="#ffffff" fill-opacity="0.38" font-size="9" font-weight="700" letter-spacing="0.5">体感</text>
      <text x="594" y="270" fill="#f5f5f7" font-size="15" font-weight="600">12°</text>

      <rect x="706" y="228" width="112" height="54" rx="13" fill="#ffffff" fill-opacity="0.055"/>
      <text x="720" y="248" fill="#ffffff" fill-opacity="0.38" font-size="9" font-weight="700" letter-spacing="0.5">湿度</text>
      <text x="720" y="270" fill="#f5f5f7" font-size="15" font-weight="600">92%</text>

      <rect x="832" y="228" width="112" height="54" rx="13" fill="#ffffff" fill-opacity="0.055"/>
      <text x="846" y="248" fill="#ffffff" fill-opacity="0.38" font-size="9" font-weight="700" letter-spacing="0.5">风力</text>
      <text x="846" y="270" fill="#f5f5f7" font-size="15" font-weight="600">西北 3</text>
    </g>

    <!-- 曲线 -->
    <rect x="580" y="296" width="364" height="86" rx="15" fill="#ffffff" fill-opacity="0.055"/>
    <path d="M596 340 C 630 330, 664 356, 698 358 C 732 360, 766 336, 800 340 C 834 344, 868 366, 902 362 C 922 360, 936 352, 944 348 L 944 372 L 596 372 Z" fill="url(#area)"/>
    <path d="M596 340 C 630 330, 664 356, 698 358 C 732 360, 766 336, 800 340 C 834 344, 868 366, 902 362 C 922 360, 936 352, 944 348"
          fill="none" stroke="#64d2ff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="596" cy="340" r="2.8" fill="#64d2ff"/>
    <text x="600" y="378" fill="#ffffff" fill-opacity="0.3" font-size="9.5">20时</text>
    <text x="770" y="378" fill="#ffffff" fill-opacity="0.3" font-size="9.5" text-anchor="middle">02时</text>
    <text x="944" y="378" fill="#ffffff" fill-opacity="0.3" font-size="9.5" text-anchor="end">08时</text>

    <!-- 三日预报 -->
    <g font-size="12">
      <text x="580" y="412" fill="#ffffff" fill-opacity="0.55" font-weight="600">今天</text>
      <g transform="translate(628 404)" stroke="#ffffff" stroke-opacity="0.72" stroke-width="1.5" stroke-linecap="round" fill="none">
        <path d="M2 11h9a3.2 3.2 0 0 0 .3-6.3 5.2 5.2 0 0 0-10-1A3.6 3.6 0 0 0 2 11Z"/>
      </g>
      <rect x="660" y="410" width="180" height="3.5" rx="1.75" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="750" y="410" width="60" height="3.5" rx="1.75" fill="url(#bar)"/>
      <text x="944" y="415" fill="#f5f5f7" font-size="12" font-weight="600" text-anchor="end">16° 12°</text>

      <text x="580" y="442" fill="#ffffff" fill-opacity="0.55" font-weight="600">明天</text>
      <g transform="translate(628 434)" stroke="#ffffff" stroke-opacity="0.72" stroke-width="1.5" stroke-linecap="round" fill="none">
        <circle cx="7" cy="7" r="3.2"/><path d="M7 0.6v1.4M7 12v1.4M0.6 7h1.4M12 7h1.4"/>
      </g>
      <rect x="660" y="440" width="180" height="3.5" rx="1.75" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="660" y="440" width="180" height="3.5" rx="1.75" fill="url(#bar)"/>
      <text x="944" y="445" fill="#f5f5f7" font-size="12" font-weight="600" text-anchor="end">18° 6°</text>

      <text x="580" y="472" fill="#ffffff" fill-opacity="0.55" font-weight="600">后天</text>
      <g transform="translate(628 464)" stroke="#ffffff" stroke-opacity="0.72" stroke-width="1.5" stroke-linecap="round" fill="none">
        <circle cx="7" cy="7" r="3.2"/><path d="M7 0.6v1.4M7 12v1.4M0.6 7h1.4M12 7h1.4"/>
      </g>
      <rect x="660" y="470" width="180" height="3.5" rx="1.75" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="684" y="470" width="135" height="3.5" rx="1.75" fill="url(#bar)"/>
      <text x="944" y="475" fill="#f5f5f7" font-size="12" font-weight="600" text-anchor="end">18° 9°</text>
    </g>

    <text x="560" y="518" fill="#ffffff" fill-opacity="0.40" font-size="12.5" font-weight="600" letter-spacing="1.2">展开态</text>
    <text x="560" y="538" fill="#ffffff" fill-opacity="0.26" font-size="12">404 × 内容高度 · 高度由内容量出，切换页面时跟着变</text>
  </g>
</svg>
